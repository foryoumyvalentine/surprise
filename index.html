<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Be My Valentine?</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            animation: float 6s linear infinite;
            opacity: 0.6;
        }

        @keyframes float {
            0%   { transform: translateY(100vh) scale(1); }
            100% { transform: translateY(-10vh) scale(1.5); }
        }

        .card {
            width: 92%;
            max-width: 500px;
            padding: 28px 22px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
            color: #333;
            position: relative;
        }

        .card img {
            width: 100%;
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        #yes {
            background: #ff4d6d;
            color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
        }

        #no {
            background: white;
            color: #333;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .success {
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to   { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

<body>

    <div class="card" id="card">
        <img src="https://media.tenor.com/ZhNxfL0GmoMAAAAj/mocha-bear-hearts.gif" alt="cute bear" />
        <h1>farhana Will you be my Valentine? 💘</h1>

        <div class="buttons">
            <button id="yes">Yes 😍</button>
            <button id="no">No 🙄</button>
        </div>
    </div>

    <script>
        const card   = document.getElementById("card");
        const yesBtn = document.getElementById("yes");
        const noBtn  = document.getElementById("no");

        function createHearts() {
            for (let i = 0; i < 20; i++) {
                let heart = document.createElement("div");
                heart.innerHTML = "💖";
                heart.className = "heart";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
                document.body.appendChild(heart);
            }
        }

        createHearts();

        let yesScale = 1;
        let resetTimer = null;

        function moveNoButton() {
            noBtn.style.position = "absolute";

            const cardRect = card.getBoundingClientRect();
            const btnRect  = noBtn.getBoundingClientRect();

            const maxX = cardRect.width  - btnRect.width  - 20;
            const maxY = cardRect.height - btnRect.height - 20;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            noBtn.style.left = x + "px";
            noBtn.style.top  = y + "px";

            yesScale += 0.12;
            yesBtn.style.transform = `scale(${yesScale})`;

            clearTimeout(resetTimer);
            resetTimer = setTimeout(() => {
                noBtn.style.position = "relative";
                noBtn.style.left = "0";
                noBtn.style.top  = "0";
            }, 1200);
        }

        noBtn.addEventListener("mouseover", moveNoButton);

        yesBtn.addEventListener("click", () => {
            confetti({ particleCount: 300, spread: 150 });

            card.innerHTML = `
                <div class="success">
                    <img src="https://i.pinimg.com/originals/00/72/a9/0072a9d486565be41a322bbfb0fdefb3.gif" />
                    <h1>YAYYYYY!!! 🎉💘</h1>
                    <p>You're officially my Valentine now 😌❤️</p>
                </div>
            `;
        });
    </script>

</body>
</html>
